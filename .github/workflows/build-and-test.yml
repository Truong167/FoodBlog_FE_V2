name: Test and Build

on:
  push:
    branches:
      - dev
  pull_request:
    types:
      - labeled
      - synchronize

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    if: contains(github.event.pull_request.labels.*.name, 'ready for review') || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
